spring.config.import=optional:file:./.env[.properties]
branchlight.cors.allowed-origins=${BRANCHLIGHT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
branchlight.openai.query-generation.enabled=${BRANCHLIGHT_OPENAI_QUERY_GENERATION_ENABLED:false}
branchlight.openai.query-generation.model=${OPENAI_QUERY_MODEL:}
branchlight.openai.query-generation.priority=${BRANCHLIGHT_OPENAI_QUERY_GENERATION_PRIORITY:false}
branchlight.query-variants.maximum-query-length=${BRANCHLIGHT_QUERY_VARIANT_MAX_LENGTH:400}
branchlight.search.brave.base-url=${BRANCHLIGHT_BRAVE_SEARCH_BASE_URL:https://api.search.brave.com}
branchlight.search.brave.timeout=${BRANCHLIGHT_BRAVE_SEARCH_TIMEOUT:5s}
branchlight.search.page-fetcher.connection-timeout=${BRANCHLIGHT_PAGE_FETCH_CONNECTION_TIMEOUT:3s}
branchlight.search.page-fetcher.response-timeout=${BRANCHLIGHT_PAGE_FETCH_RESPONSE_TIMEOUT:10s}
branchlight.search.page-fetcher.maximum-redirects=${BRANCHLIGHT_PAGE_FETCH_MAXIMUM_REDIRECTS:5}
branchlight.search.page-fetcher.maximum-response-bytes=${BRANCHLIGHT_PAGE_FETCH_MAXIMUM_RESPONSE_BYTES:1048576}
branchlight.search.preliminary-ranking.maximum-candidates=${BRANCHLIGHT_PRELIMINARY_RANKING_MAXIMUM_CANDIDATES:25}
branchlight.search.preliminary-ranking.minimum-distinct-title-terms=${BRANCHLIGHT_PRELIMINARY_RANKING_MINIMUM_DISTINCT_TITLE_TERMS:2}
branchlight.search.preliminary-ranking.minimum-distinct-snippet-terms=${BRANCHLIGHT_PRELIMINARY_RANKING_MINIMUM_DISTINCT_SNIPPET_TERMS:4}
branchlight.search.preliminary-ranking.title-lexical-overlap-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_TITLE_LEXICAL_OVERLAP_WEIGHT:3.0}
branchlight.search.preliminary-ranking.snippet-lexical-overlap-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_SNIPPET_LEXICAL_OVERLAP_WEIGHT:2.0}
branchlight.search.preliminary-ranking.provider-rank-prior-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_PROVIDER_RANK_PRIOR_WEIGHT:1.0}
branchlight.search.preliminary-ranking.generated-query-discovery-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_GENERATED_QUERY_DISCOVERY_WEIGHT:0.25}
branchlight.search.preliminary-ranking.retrieval-purpose-diversity-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_RETRIEVAL_PURPOSE_DIVERSITY_WEIGHT:0.25}
branchlight.search.preliminary-ranking.title-specificity-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_TITLE_SPECIFICITY_WEIGHT:0.5}
branchlight.search.preliminary-ranking.low-quality-penalty-weight=${BRANCHLIGHT_PRELIMINARY_RANKING_LOW_QUALITY_PENALTY_WEIGHT:1.0}
