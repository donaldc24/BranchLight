branchlight:
  openai:
    query-generation:
      max-output-tokens: ${BRANCHLIGHT_OPENAI_QUERY_GENERATION_MAX_OUTPUT_TOKENS:96}
      reasoning-effort: ${BRANCHLIGHT_OPENAI_QUERY_GENERATION_REASONING_EFFORT:NONE}
      verbosity: ${BRANCHLIGHT_OPENAI_QUERY_GENERATION_VERBOSITY:LOW}
  search:
    execution:
      # Provider requests are I/O-bound. Keep this below upstream rate limits.
      provider-query-parallelism: ${BRANCHLIGHT_PROVIDER_QUERY_PARALLELISM:6}
      # Page downloads are the main latency source; HttpPageFetcher caps at 25.
      page-fetch-parallelism: ${BRANCHLIGHT_PAGE_FETCH_PARALLELISM:25}
      # Extraction and deterministic per-document evaluation are CPU-bound.
      page-processing-parallelism: ${BRANCHLIGHT_PAGE_PROCESSING_PARALLELISM:8}